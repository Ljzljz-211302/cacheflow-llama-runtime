[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-inference-lab"
version = "0.1.0"
description = "Reproducible llama.cpp quantization and inference benchmark lab"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interview_assistant = ["static/*"]
