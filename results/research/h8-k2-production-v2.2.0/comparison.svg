<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">K1 and K2 production comparison</title>
  <desc id="desc">K2 reduces server prompt median, client median, client P95, and aggregate 24-layer kernel duration.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172033">Restricted Paged K2 vs K1 — formal v2.2</text>
  <text x="450" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#586174">30 steady-state pairs · Qwen2.5-0.5B · D64/GQA7 · context 17</text>
  <g font-family="Arial,sans-serif" font-size="15">
    <text x="35" y="125" fill="#172033">Server prompt median (ms)</text>
    <rect x="265" y="103" width="219" height="22" rx="4" fill="#8aa4c8"/><text x="492" y="120" fill="#172033">K1 4.3785</text>
    <rect x="265" y="132" width="208" height="22" rx="4" fill="#177f72"/><text x="481" y="149" fill="#172033">K2 4.1585  (-5.02%)</text>
    <text x="35" y="215" fill="#172033">Client median (ms)</text>
    <rect x="265" y="193" width="274" height="22" rx="4" fill="#8aa4c8"/><text x="547" y="210" fill="#172033">K1 6.8473</text>
    <rect x="265" y="222" width="231" height="22" rx="4" fill="#177f72"/><text x="504" y="239" fill="#172033">K2 5.7631  (-15.83%)</text>
    <text x="35" y="305" fill="#172033">Client P95 (ms)</text>
    <rect x="265" y="283" width="452" height="22" rx="4" fill="#8aa4c8"/><text x="725" y="300" fill="#172033">K1 30.1442</text>
    <rect x="265" y="312" width="447" height="22" rx="4" fill="#177f72"/><text x="720" y="329" fill="#172033">K2 29.8194  (-1.08%)</text>
    <text x="35" y="395" fill="#172033">24-layer kernel total (ms)</text>
    <rect x="265" y="373" width="290" height="22" rx="4" fill="#8aa4c8"/><text x="563" y="390" fill="#172033">K1 0.414371</text>
    <rect x="265" y="402" width="144" height="22" rx="4" fill="#177f72"/><text x="417" y="419" fill="#172033">K2 0.205313  (-50.45%)</text>
  </g>
  <line x1="265" y1="95" x2="265" y2="440" stroke="#c7ced9" stroke-width="1"/>
  <rect x="35" y="470" width="14" height="14" rx="2" fill="#8aa4c8"/><text x="57" y="482" font-family="Arial,sans-serif" font-size="13" fill="#586174">K1 incumbent</text>
  <rect x="175" y="470" width="14" height="14" rx="2" fill="#177f72"/><text x="197" y="482" font-family="Arial,sans-serif" font-size="13" fill="#586174">K2 candidate</text>
  <text x="865" y="482" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#7b8495">NSYS duration is mechanism evidence; service timing is unprofiled.</text>
</svg>
