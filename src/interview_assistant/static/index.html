<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>研途 · 面试学习助手</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">研</span><div><strong>研途</strong><small>面试学习助手</small></div></div>
      <button id="new-session" class="new-session">＋ 新建练习</button>
      <nav id="sessions" aria-label="历史练习"></nav>
      <div class="runtime"><span id="status-dot"></span><div><strong id="status-text">正在连接</strong><small id="knowledge-status">读取资料库…</small></div></div>
    </aside>
    <main>
      <header><div><p class="eyebrow">CACHEFLOW RUNTIME</p><h1 id="session-title">今天，从一次追问开始。</h1></div><span class="privacy">本地运行 · 资料不出设备</span></header>
      <section id="empty" class="empty-state">
        <div class="orb"><span>问</span></div>
        <h2>把知识讲清楚，才算真的会。</h2>
        <p>基于你的 408、机器学习、数据库、编译原理与数学资料，回答问题并给出可核对的引用。</p>
        <div class="starters">
          <button>用直觉和公式解释偏差—方差分解</button>
          <button>模拟一轮操作系统进程与线程追问</button>
          <button>数据库索引为什么通常使用 B+ 树？</button>
        </div>
      </section>
      <section id="messages" class="messages" aria-live="polite"></section>
      <form id="composer">
        <textarea id="question" rows="1" maxlength="8000" placeholder="输入一个面试问题，Enter 发送，Shift+Enter 换行" aria-label="面试问题"></textarea>
        <button id="send" type="submit" aria-label="发送">↑</button>
      </form>
      <p class="footnote">回答由本地模型生成，请根据引用资料复核关键信息。</p>
    </main>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
